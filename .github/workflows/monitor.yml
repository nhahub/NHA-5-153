name: Scheduled model monitoring

# Production note: this job reads the prediction/outcome logs written by the API. In a real deployment the
# logs live on a persistent volume or object store; point MONITORING_DIR at a synced copy before the run
# (e.g. an `aws s3 sync` step). With no traffic logs the job reports "no predictions" and passes.
on:
  schedule:
    - cron: "0 6 * * *"      # daily, 06:00 UTC
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Run monitoring (fails the job on a CRITICAL finding)
        run: python -m attrition.monitoring.monitor --window-hours 168 --fail-on critical
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          MLFLOW_DISABLE_AGENT_HINT: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monitoring-report
          path: monitoring/reports/
          if-no-files-found: ignore
      - name: Retraining recommended?
        if: failure()
        run: echo "::warning::Monitoring raised a critical finding. Run 'python -m attrition.retrain' (see docs/Retraining_Strategy.md)."
