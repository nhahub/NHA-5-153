[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attrition-mlops"
version = "1.0.0"
description = "Employee attrition prediction: training, MLflow tracking, FastAPI serving, Streamlit dashboard, monitoring and retraining."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "imbalanced-learn>=0.11",
    "xgboost>=2.0",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "mlflow>=2.10",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
    "streamlit>=1.32",
    "plotly>=5.18",
    "matplotlib>=3.7",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.26"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["attrition*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
